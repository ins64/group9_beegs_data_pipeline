# Run once before the defence (and after each rehearsal): parks the lab files used by the live demo in
# @BEEGS.OPS.LANDING/demo_parking/ (no pipe or COPY reads this folder), then prints the health check.
# The tag goes into the file names: Snowpipe never loads the same file name twice, so each demo needs a new tag.
name: demo-prepare
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag used in snowflake/demo/live_demo.sql (default: live)"
        default: "live"
permissions:
  contents: read
env:
  SF_ACCOUNT: ZEFQCKT-WL69349
  KEY_FILE: /tmp/snowflake_deploy.p8
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Snowflake CLI + key
        env:
          KEY: ${{ secrets.SNOWFLAKE_DEPLOY_PRIVATE_KEY }}
        run: |
          pip install -q snowflake-cli==3.31.0
          pip install -q cryptography==43.0.3
          KEY="$KEY" python scripts/ci/write_key.py $KEY_FILE
      - name: Park the demo files
        run: |
          CONN="-x --account $SF_ACCOUNT --user BEEGS_DEPLOY_SVC --authenticator SNOWFLAKE_JWT --private-key-file $KEY_FILE --role BEEGS_ADMIN --warehouse BEEGS_BI_WH"
          cp incidents/lab_results_lab_apinov_BROKEN.csv /tmp/lab_results_lab_apinov_BROKEN_${{ inputs.tag }}.csv
          cp incidents/lab_results_lab_apinov_FIXED.csv  /tmp/lab_results_lab_apinov_FIXED_${{ inputs.tag }}.csv
          snow stage copy /tmp/lab_results_lab_apinov_BROKEN_${{ inputs.tag }}.csv @BEEGS.OPS.LANDING/demo_parking/ --overwrite $CONN
          snow stage copy /tmp/lab_results_lab_apinov_FIXED_${{ inputs.tag }}.csv  @BEEGS.OPS.LANDING/demo_parking/ --overwrite $CONN
          snow sql --enable-templating NONE $CONN -q "SELECT COUNT(*) AS already_loaded_by_snowpipe FROM BEEGS.BRONZE.LAB_RESULTS_RAW WHERE _source_file ILIKE '%_${{ inputs.tag }}.csv'"
          echo "If already_loaded_by_snowpipe > 0, this tag was already used: run again with a new tag and replace _live in live_demo.sql."
      - name: Health check
        run: |
          snow sql --enable-templating NONE -x --account $SF_ACCOUNT --user BEEGS_DEPLOY_SVC --authenticator SNOWFLAKE_JWT \
            --private-key-file $KEY_FILE --role BEEGS_ADMIN --warehouse BEEGS_BI_WH -f snowflake/demo/health_check.sql
